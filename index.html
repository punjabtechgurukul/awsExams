<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AWS CLF-C02 Mock Tests</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --border:#dfe4ec; --accent:#1769e0; --good:#16803c; --bad:#c62828; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
button { font:inherit; }
.app { max-width:900px; margin:0 auto; padding:24px 18px 48px; }
header { text-align:center; padding:18px 0 24px; }
h1 { margin:0 0 8px; font-size:30px; }
.subtitle { color:var(--muted); font-size:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 3px 12px rgba(0,0,0,.04); }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.test-btn { min-height:92px; border:1px solid var(--border); background:#fff; border-radius:16px; padding:16px; text-align:left; cursor:pointer; }
.test-btn:active { transform:scale(.99); }
.test-title { font-weight:700; font-size:18px; margin-bottom:5px; }
.test-meta { color:var(--muted); font-size:14px; }
.hidden { display:none !important; }
.topbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.back, .navbtn { border:1px solid var(--border); background:#fff; padding:10px 14px; border-radius:12px; cursor:pointer; }
.progress-wrap { flex:1; min-width:180px; }
.progress-text { text-align:center; font-size:14px; color:var(--muted); margin-bottom:7px; }
.progress { height:8px; background:#e8edf5; border-radius:99px; overflow:hidden; }
.progress > div { height:100%; background:var(--accent); width:0; }
.question-card h2 { font-size:21px; line-height:1.4; margin:0 0 20px; }
.option { width:100%; text-align:left; background:#fff; border:2px solid var(--border); border-radius:14px; padding:15px; margin:9px 0; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
.option .letter { font-weight:800; min-width:28px; }
.option.selected { border-color:var(--accent); background:#f0f6ff; }
.option.correct { border-color:var(--good); background:#eefaf2; }
.option.wrong { border-color:var(--bad); background:#fff0f0; }
.option:disabled { cursor:default; opacity:1; }
.feedback { margin-top:16px; padding:15px; border-radius:13px; line-height:1.5; }
.feedback.good { background:#eefaf2; color:#145c2f; }
.feedback.bad { background:#fff0f0; color:#8c1d1d; }
.actions { display:flex; justify-content:space-between; gap:12px; margin-top:20px; }
.primary { background:var(--accent); color:#fff; border:0; border-radius:13px; padding:13px 20px; cursor:pointer; font-weight:700; }
.primary:disabled { opacity:.45; cursor:default; }
.secondary { background:#fff; color:var(--text); border:1px solid var(--border); border-radius:13px; padding:13px 20px; cursor:pointer; }
.result { text-align:center; }
.score { font-size:52px; font-weight:800; margin:10px 0; }
.result-note { color:var(--muted); margin-bottom:20px; }
.review { text-align:left; margin-top:20px; }
.review-item { border-top:1px solid var(--border); padding:15px 0; }
@media (max-width:600px) {
  .app { padding:14px 12px 35px; }
  h1 { font-size:26px; }
  .grid { grid-template-columns:1fr; }
  .question-card h2 { font-size:19px; }
  .actions { position:sticky; bottom:0; background:rgba(245,247,251,.96); padding:10px 0; }
}
</style>
</head>
<body>
<div class="app">
  <section id="home">
    <header>
      <h1>AWS Cloud Practitioner</h1>
      <div class="subtitle">CLF-C02 • 10 Mock Tests • 100 Questions Each</div>
    </header>
    <div class="card">
      <h2>Select a Mock Test</h2>
      <p class="subtitle">Each test contains 100 exam-level questions. Select an answer to get immediate feedback.</p>
      <div id="testGrid" class="grid"></div>
    </div>
  </section>

  <section id="exam" class="hidden">
    <div class="topbar">
      <button class="back" id="backBtn">← Tests</button>
      <div class="progress-wrap">
        <div class="progress-text" id="progressText"></div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>
    </div>
    <div class="card question-card">
      <h2 id="questionText"></h2>
      <div id="options"></div>
      <div id="feedback" class="hidden"></div>
      <div class="actions">
        <button class="secondary" id="prevBtn">Previous</button>
        <button class="primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>
  </section>

  <section id="result" class="hidden">
    <header>
      <h1 id="resultTitle">Mock Test Complete</h1>
    </header>
    <div class="card result">
      <div class="score" id="score"></div>
      <div class="result-note" id="resultNote"></div>
      <button class="primary" id="retryBtn">Retake Test</button>
      <button class="secondary" id="homeBtn" style="margin-left:8px;">Choose Another Test</button>
      <div id="review" class="review"></div>
    </div>
  </section>
</div>

<script>
const tests = Array.from({length:10}, (_,i) => ({
  no:i+1, file:`tests/test-${i+1}.json`
}));

let currentTest = null;
let questions = [];
let index = 0;
let answers = {};
let score = 0;

const $ = id => document.getElementById(id);

function show(section) {
  ["home","exam","result"].forEach(id => $(id).classList.toggle("hidden", id !== section));
  window.scrollTo(0,0);
}

function renderTests() {
  $("testGrid").innerHTML = tests.map(t => `
    <button class="test-btn" onclick="startTest(${t.no})">
      <div class="test-title">Mock Test ${t.no}</div>
      <div class="test-meta">100 questions • Exam-level • Instant feedback</div>
    </button>
  `).join("");
}

async function startTest(no) {
  const res = await fetch(`tests/test-${no}.json`);
  questions = await res.json();
  currentTest = no;
  index = 0;
  answers = {};
  score = 0;
  show("exam");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[index];
  $("progressText").textContent = `Mock Test ${currentTest} • Question ${index+1} of ${questions.length}`;
  $("progressBar").style.width = `${((index+1)/questions.length)*100}%`;
  $("questionText").textContent = q.question;

  $("options").innerHTML = q.options.map((opt,i) => {
    const letter = "ABCD"[i];
    const chosen = answers[index];
    let cls = "";
    if (chosen !== undefined) {
      if (letter === q.correctAnswer) cls = "correct";
      else if (letter === chosen) cls = "wrong";
    } else if (letter === chosen) cls = "selected";
    return `<button class="option ${cls}" ${chosen !== undefined ? "disabled":""} onclick="selectAnswer('${letter}')">
      <span class="letter">${letter}.</span><span>${escapeHtml(opt)}</span>
    </button>`;
  }).join("");

  if (answers[index] !== undefined) {
    const correct = answers[index] === q.correctAnswer;
    $("feedback").className = `feedback ${correct ? "good":"bad"}`;
    $("feedback").innerHTML = `<strong>${correct ? "Correct" : "Incorrect"}</strong><br>
      Correct answer: <strong>${q.correctAnswer}</strong><br>${escapeHtml(q.explanation)}`;
    $("feedback").classList.remove("hidden");
  } else {
    $("feedback").classList.add("hidden");
  }

  $("prevBtn").disabled = index === 0;
  $("nextBtn").disabled = answers[index] === undefined;
  $("nextBtn").textContent = index === questions.length-1 ? "Finish Test" : "Next";
}

function selectAnswer(letter) {
  if (answers[index] !== undefined) return;
  answers[index] = letter;
  if (letter === questions[index].correctAnswer) score++;
  renderQuestion();
}

function nextQuestion() {
  if (answers[index] === undefined) return;
  if (index < questions.length-1) {
    index++;
    renderQuestion();
  } else {
    showResult();
  }
}

function previousQuestion() {
  if (index > 0) {
    index--;
    renderQuestion();
  }
}

function showResult() {
  show("result");
  const pct = Math.round((score/questions.length)*100);
  $("score").textContent = `${score} / ${questions.length}`;
  $("resultNote").textContent = `${pct}% score • ${pct >= 70 ? "Good performance" : "Keep practicing"}`
  $("review").innerHTML = questions.map((q,i) => {
    const a = answers[i];
    const ok = a === q.correctAnswer;
    return `<div class="review-item">
      <strong>Q${i+1}. ${escapeHtml(q.question)}</strong><br>
      Your answer: <strong>${a || "Not answered"}</strong> • Correct: <strong>${q.correctAnswer}</strong>
      <div style="color:${ok ? 'var(--good)':'var(--bad)'};margin-top:5px">${ok ? "Correct" : "Incorrect"}</div>
    </div>`;
  }).join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

$("backBtn").onclick = () => show("home");
$("prevBtn").onclick = previousQuestion;
$("nextBtn").onclick = nextQuestion;
$("retryBtn").onclick = () => startTest(currentTest);
$("homeBtn").onclick = () => show("home");

renderTests();
</script>
</body>
</html>
